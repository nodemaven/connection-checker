# Public-facing credentials + read-back API for the Connection Checker.
# Put it behind your TLS reverse proxy at e.g. api.example.com.
#
#   docker compose up -d --build
services:
  credentials:
    build: .
    container_name: cc-credentials
    # host networking so it can reach turn-readback on 127.0.0.1:8004
    network_mode: host
    restart: unless-stopped
    environment:
      TURN_HOST: ${TURN_HOST}
      TURN_SECRET: ${TURN_STATIC_AUTH_SECRET}
      TURN_PORT: ${TURN_PORT:-3478}
      READBACK_URL: http://127.0.0.1:8004
      READBACK_SECRET: ${TURN_READBACK_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8006/healthz', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
