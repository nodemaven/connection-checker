name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/credentials
          - backend/http3-probe
          - backend/coturn/stun-observe
          - backend/coturn/turn-readback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r ${{ matrix.service }}/requirements.txt pytest
      - name: Run tests
        run: cd ${{ matrix.service }} && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the frontend JS
        run: node --check frontend/app.js && node --check frontend/config.js
